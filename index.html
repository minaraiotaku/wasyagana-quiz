      videoTitle: "【福袋】激レアサイン、ロボアニメ大御所の方々にもらっちゃいました！&シャマってる映画パンフ【開封動画】",
      videoUrl: "https://www.youtube.com/watch?v=EmrmbLEuFfE",
      blurb: "安彦良和先生や富野由悠季展、天神さんの展示会で手に入れたサイン入りの本を紹介した後、余っていた映画パンフレットをまとめて紹介していく私物回。",
      locked: false,
      questions: [
        {
          q: "動画内でマフィア梶田が紹介した「安彦良和の歴史漫画ガイド」に書かれていたサインの内容は？",
          choices: ["「梶田さんへ」という直筆メッセージ付きサイン", "発行日のみのサイン", "匿名のサイン", "サインではなくハンコ"],
          correct: 0,
          explain: "正解は「梶田さんへ」というメッセージ付きサイン。「カジ田さんへって書いてくださっているんです」と大切そうに紹介していた。"
        },
        {
          q: "動画内で紹介された、パトレイバーとコラボしていたロボット玩具ブランドは？",
          choices: ["トランスフォーマー", "ダイアクロン", "ゾイド", "メタルビルド"],
          correct: 2,
          explain: "正解はゾイド。「このコラボ驚いたわ。ゾイド。ゾイドコラボ」「警察家系になってんですよ」と紹介された。"
        },
        {
          q: "動画内で話していた、「トランスフォーマー」と「ダイアクロン」というロボット玩具ブランドの関係は？",
          choices: ["全く無関係の別会社", "元は兄弟のような関係にあるブランド", "ダイアクロンはトランスフォーマーの偽物", "同じデザイナーが今作った新ブランド"],
          correct: 1,
          explain: "正解は兄弟のような関係。「トランスフォーマーとダイアクロンってそもそもそうですよね。兄弟みたいな関係性なんです」と話していた。"
        },
        {
          q: "シャマラン監督作品のパンフレットを読みながら、二人が使っていた「しゃまらん」という独自用語はどんな意味だったか？",
          choices: ["続編が確定している映画のこと", "ブルース・ウィリスが出演していない映画のこと", "実写化前の原作小説のこと", "結末が観客の解釈に委ねられ、ハッキリしないまま終わる映画のこと"],
          correct: 3,
          explain: "正解は結末が観客の解釈に委ねられること。「観客1人1人が自分でストーリーのエンディングを作ってほしい」という監督の言葉から生まれた独自用語だった。"
        },
        {
          q: "映画『アンブレイカブル』は、後にどんな三部作としてつながっていくと紹介されていたか？",
          choices: ["『シックス・センス』→『サイン』→『アンブレイカブル』", "『アンブレイカブル』→『スプリット』→『ミスター・ガラス』", "単独作品で続編は一切ない", "リメイク版が3本作られた"],
          correct: 1,
          explain: "正解は『アンブレイカブル』『スプリット』『ミスター・ガラス』の三部作。「アンブレイカブル、スプリット、ミスターガラスまで」「3部作の3作目」と紹介された。"
        }
      ],
      ranks: [
        { min: 5, badge: "安彦良和サイン本の継承者", line: "レアなサインの由来まで完璧に記憶。もはや本人公認のコレクター。" },
        { min: 4, badge: "しゃまらん判定士", line: "細かい小ネタや用語まで押さえている良きファン。" },
        { min: 3, badge: "ダイアクロン兄弟説を語れる者", line: "見どころはしっかり楽しめている、なかなかの記憶力。" },
        { min: 1, badge: "パンフレット読み込み班", line: "楽しんではいたが、細部の記憶はうろ覚え。" },
        { min: 0, badge: "シャマラン映画で置いてかれた勢", line: "話についていくだけで精一杯だったタイプ。" }
      ]
    },
    {
      id: "coming-soon",
      number: 101,
      videoTitle: "NEXT FILE",
      blurb: "新しいエピソードは準備が整い次第、ここに追加していきます。お楽しみに。",
      locked: true
    }
  ];

  const SHARE_URL = "https://minaraiotaku.github.io/wasyagana-quiz/";

  const appEl = document.getElementById("app");
  const backBtn = document.getElementById("backBtn");
  const signoffEl = document.getElementById("signoff");

  const PAGE_SIZE = 20; // episodes per pager page
  const STORAGE_KEY = "wasyagana-quiz-state-v1";

  let activeEpisode = null;
  let current = 0;
  let answers = [];
  let currentPage = 0;

  function persistState() {
    try {
      if (!activeEpisode) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ view: "home", currentPage }));
      } else if (current >= activeEpisode.questions.length) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ view: "results", episodeId: activeEpisode.id, answers }));
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ view: "quiz", episodeId: activeEpisode.id, current, answers }));
      }
    } catch (e) {}
  }

  function loadPersistedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const state = JSON.parse(raw);
      return state && typeof state === "object" ? state : null;
    } catch (e) {
      return null;
    }
  }

  function restoreView() {
    const state = loadPersistedState();
    if (!state) { renderHome(); return; }

    if (state.view === "home") {
      currentPage = Number.isInteger(state.currentPage) && state.currentPage >= 0 ? state.currentPage : 0;
      renderHome();
      return;
    }

    const ep = EPISODES.find((e) => e.id === state.episodeId && !e.locked);
    if (!ep || !Array.isArray(state.answers) || state.answers.length !== ep.questions.length) {
      renderHome();
      return;
    }

    activeEpisode = ep;
    answers = state.answers;
    backBtn.classList.add("show");
    signoffEl.textContent = `SOURCE: ${ep.videoTitle}`;

    if (state.view === "results") {
      current = ep.questions.length;
      renderResults();
    } else if (state.view === "quiz" && Number.isInteger(state.current) && state.current >= 0 && state.current < ep.questions.length) {
      current = state.current;
      answers[current] = null; // re-render the in-progress question fresh, unanswered
      renderQuestion();
    } else {
      renderHome();
    }
  }

  function shareResult(ep, score, rank, btn) {
    const text = `「わしゃがなTV4択クイズ」\n${ep.videoTitle}\nランク「${rank.badge}」（${score}/${ep.questions.length}問正解）でした！\nあなたも挑戦してみて`;

    if (navigator.share) {
      navigator.share({ title: "わしゃがなTV4択クイズ", text, url: SHARE_URL }).catch(() => {});
      return;
    }

    const tweetUrl = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text + "\n") + "&url=" + encodeURIComponent(SHARE_URL);
    const opened = window.open(tweetUrl, "_blank", "noopener,noreferrer");

    if (!opened && navigator.clipboard) {
      navigator.clipboard.writeText(text + "\n" + SHARE_URL).then(() => {
        if (btn) {
          const original = btn.textContent;
          btn.textContent = "コピーしました";
          setTimeout(() => { btn.textContent = original; }, 2000);
        }
      }).catch(() => {});
    }
  }

  backBtn.addEventListener("click", renderHome);

  function renderHome() {
    activeEpisode = null;
    backBtn.classList.remove("show");
    signoffEl.textContent = "SOURCE: マフィア梶田と中村悠一の「わしゃがなTV」（@WasyaganaTV）／本アプリは非公式のファンクイズです";
    appEl.innerHTML = "";

    const lede = document.createElement("p");
    lede.className = "archive-lede";
    lede.innerHTML = `「わしゃがなTV」の各回から出題する<b>非公式4択クイズ集</b>。エピソードを選んでスタート。動画が増えるたびに、ここにファイルを追加していきます。`;
    appEl.appendChild(lede);

    const maxNumber = EPISODES.reduce((max, ep) => Math.max(max, ep.number), 1);
    const totalPages = Math.max(1, Math.ceil(maxNumber / PAGE_SIZE));
    if (currentPage >= totalPages) currentPage = totalPages - 1;
    if (currentPage < 0) currentPage = 0;

    if (totalPages > 1) appEl.appendChild(renderPager(totalPages));

    const list = document.createElement("div");
    list.className = "ep-list";

    const pageEpisodes = EPISODES.filter((ep) => Math.floor((ep.number - 1) / PAGE_SIZE) === currentPage);

    pageEpisodes.forEach((ep) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "ep-card" + (ep.locked ? " locked" : "");
      card.disabled = !!ep.locked;

      const top = document.createElement("div");
      top.className = "ep-top";
      const numEl = document.createElement("span");
      numEl.className = "ep-num";
      numEl.textContent = `FILE ${String(ep.number).padStart(3, "0")}`;
      const badge = document.createElement("span");
      badge.className = "ep-badge" + (ep.locked ? " locked" : "");
      badge.textContent = ep.locked ? "近日追加" : `全${ep.questions.length}問`;
      top.appendChild(numEl);
      top.appendChild(badge);
      card.appendChild(top);

      const body = document.createElement("div");
      body.className = "ep-card-body";

      const textCol = document.createElement("div");
      textCol.className = "ep-card-text";

      const titleEl = document.createElement("p");
      titleEl.className = "ep-title";
      titleEl.textContent = ep.videoTitle;
      textCol.appendChild(titleEl);

      const blurbEl = document.createElement("p");
      blurbEl.className = "ep-blurb";
      blurbEl.textContent = ep.blurb;
      textCol.appendChild(blurbEl);

      body.appendChild(textCol);
      card.appendChild(body);

      if (!ep.locked) {
        card.addEventListener("click", () => startEpisode(ep));
      }
      list.appendChild(card);
    });

    appEl.appendChild(list);

    if (totalPages > 1) appEl.appendChild(renderPager(totalPages));

    persistState();
  }

  function renderPager(totalPages) {
    const pager = document.createElement("div");
    pager.className = "pager";

    const prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.className = "pager-btn pager-arrow";
    prevBtn.textContent = "◀";
    prevBtn.disabled = currentPage === 0;
    prevBtn.addEventListener("click", () => { currentPage--; renderHome(); window.scrollTo(0, 0); });
    pager.appendChild(prevBtn);

    for (let i = 0; i < totalPages; i++) {
      const startNum = i * PAGE_SIZE + 1;
      const endNum = (i + 1) * PAGE_SIZE;
      const pageBtn = document.createElement("button");
      pageBtn.type = "button";
      pageBtn.className = "pager-btn" + (i === currentPage ? " active" : "");
      pageBtn.textContent = `FILE${String(startNum).padStart(3, "0")}-${String(endNum).padStart(3, "0")}`;
      pageBtn.addEventListener("click", () => { currentPage = i; renderHome(); window.scrollTo(0, 0); });
      pager.appendChild(pageBtn);
    }

    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "pager-btn pager-arrow";
    nextBtn.textContent = "▶";
    nextBtn.disabled = currentPage === totalPages - 1;
    nextBtn.addEventListener("click", () => { currentPage++; renderHome(); window.scrollTo(0, 0); });
    pager.appendChild(nextBtn);

    return pager;
  }

  function startEpisode(ep) {
    activeEpisode = ep;
    current = 0;
    answers = new Array(ep.questions.length).fill(null);
    backBtn.classList.add("show");
    signoffEl.textContent = `SOURCE: ${ep.videoTitle}`;
    renderQuestion();
  }

  function renderGauge(container) {
    const gauge = document.createElement("div");
    gauge.className = "gauge";
    activeEpisode.questions.forEach((_, i) => {
      const seg = document.createElement("i");
      if (i < current) seg.classList.add("done");
      else if (i === current) seg.classList.add("current");
      gauge.appendChild(seg);
    });
    container.appendChild(gauge);
    return gauge;
  }

  function renderQuestion() {
    const ep = activeEpisode;
    const data = ep.questions[current];
    appEl.innerHTML = "";

    if (current === 0) {
      const titleRow = document.createElement("div");
      titleRow.className = "quiz-title-row";
      const titleText = document.createElement("div");
      titleText.className = "quiz-title-text";
      titleText.innerHTML = `<div class="quiz-eyebrow">FILE ${String(ep.number).padStart(3, "0")}</div><h2 class="quiz-title">${ep.videoTitle}</h2>`;
      titleRow.appendChild(titleText);
      appEl.appendChild(titleRow);
      if (ep.briefing) {
        const briefing = document.createElement("p");
        briefing.className = "archive-lede";
        briefing.textContent = ep.briefing;
        appEl.appendChild(briefing);
      }
    }

    const gauge = renderGauge(appEl);

    const tag = document.createElement("div");
    tag.className = "q-tag";
    tag.innerHTML = `QUESTION ${String(current + 1).padStart(2, "0")} <span>/ ${String(ep.questions.length).padStart(2, "0")}</span>`;
    appEl.appendChild(tag);

    const qText = document.createElement("p");
    qText.className = "q-text";
    qText.textContent = data.q;
    appEl.appendChild(qText);

    const choicesEl = document.createElement("div");
    choicesEl.className = "choices";
    const letters = ["A", "B", "C", "D"];

    data.choices.forEach((choiceText, idx) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = `<span class="mark">${letters[idx]}</span><span>${choiceText}</span>`;
      btn.addEventListener("click", () => selectAnswer(idx, choicesEl, explainEl, nextBtn, gauge));
      choicesEl.appendChild(btn);
    });
    appEl.appendChild(choicesEl);

    const explainEl = document.createElement("div");
    explainEl.className = "explain";
    explainEl.innerHTML = `<span class="label">DATA LOG</span>${data.explain}`;
    appEl.appendChild(explainEl);

    const nextBtn = document.createElement("button");
    nextBtn.className = "next-btn";
    nextBtn.textContent = current === ep.questions.length - 1 ? "検査結果を見る ▶" : "次の設問へ ▶";
    nextBtn.addEventListener("click", () => {
      current++;
      if (current < ep.questions.length) renderQuestion();
      else renderResults();
    });
    appEl.appendChild(nextBtn);

    persistState();
  }

  function selectAnswer(idx, choicesEl, explainEl, nextBtn, gauge) {
    if (answers[current] !== null) return;
    answers[current] = idx;
    const data = activeEpisode.questions[current];
    const buttons = choicesEl.querySelectorAll(".choice");

    buttons.forEach((b, i) => {
      b.classList.add("disabled");
      if (i === data.correct) {
        b.classList.add("correct");
        b.insertAdjacentHTML("beforeend", '<span class="result-icon">正解</span>');
      } else if (i === idx) {
        b.classList.add("wrong");
        b.insertAdjacentHTML("beforeend", '<span class="result-icon">不正解</span>');
      } else {
        b.classList.add("dim");
      }
      b.onclick = null;
    });

    explainEl.classList.add("show");
    nextBtn.classList.add("show");
    const seg = gauge.children[current];
    if (seg) { seg.classList.remove("current"); seg.classList.add("done"); }

    persistState();
  }

  function renderResults() {
    const ep = activeEpisode;
    const score = answers.reduce((acc, a, i) => acc + (a === ep.questions[i].correct ? 1 : 0), 0);
    const rank = ep.ranks.find(r => score >= r.min);

    appEl.innerHTML = "";
    renderGauge(appEl);

    const wrap = document.createElement("div");
    wrap.className = "results";

    const rankRow = document.createElement("div");
    rankRow.className = "rank-row";
    rankRow.innerHTML = `<span class="rank-badge">${rank.badge}</span><span class="rank-score">SCORE ${score} / ${ep.questions.length}</span>`;
    wrap.appendChild(rankRow);

    const rankLine = document.createElement("p");
    rankLine.className = "rank-line";
    rankLine.textContent = rank.line;
    wrap.appendChild(rankLine);

    const recap = document.createElement("div");
    recap.className = "recap";
    ep.questions.forEach((data, i) => {
      const ok = answers[i] === data.correct;
      const item = document.createElement("div");
      item.className = "recap-item " + (ok ? "ok" : "ng");
      item.innerHTML = `<span class="r-mark">${ok ? "○" : "×"}</span><span>Q${i + 1}. <b>${data.q}</b><br>正解：${data.choices[data.correct]}</span>`;
      recap.appendChild(item);
    });
    wrap.appendChild(recap);

    const actions = document.createElement("div");
    actions.className = "actions";

    const shareBtn = document.createElement("button");
    shareBtn.className = "btn btn-primary";
    shareBtn.textContent = "結果をシェアする ▶";
    shareBtn.addEventListener("click", () => shareResult(ep, score, rank, shareBtn));
    actions.appendChild(shareBtn);

    const retryBtn = document.createElement("button");
    retryBtn.className = "btn btn-ghost";
    retryBtn.textContent = "もう一度挑戦する";
    retryBtn.addEventListener("click", () => startEpisode(ep));
    actions.appendChild(retryBtn);

    if (ep.videoUrl) {
      const videoLink = document.createElement("a");
      videoLink.className = "btn btn-ghost";
      videoLink.href = ep.videoUrl;
      videoLink.target = "_blank";
      videoLink.rel = "noopener noreferrer";
      videoLink.textContent = "元動画を見る ▶";
      actions.appendChild(videoLink);
    }

    const homeBtn = document.createElement("button");
    homeBtn.className = "btn btn-ghost";
    homeBtn.textContent = "アーカイブに戻る";
    homeBtn.addEventListener("click", renderHome);
    actions.appendChild(homeBtn);

    wrap.appendChild(actions);
    appEl.appendChild(wrap);

    persistState();
  }

  restoreView();
</script>
</body>
</html>
